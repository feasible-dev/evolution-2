<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cible — carton, dessin et slider</title><link rel="stylesheet" href="cartes.css"></head><body><main><header><h1>Cible</h1><p>Carton sobre. Image nette. Slider moderne.</p></header><section class="studies"><figure><figcaption>Ivoire / particule</figcaption><article class="card ivoire"><h2>Cible</h2><div class="art"><img src="images/particule.svg" alt="Un point se dirige vers sa cible."></div><p>Accélère vers sa cible.</p><div class="adjustment"><label for="weight-0">Poids</label><input id="weight-0" type="range" min="0" max="10" value="4" aria-label="Poids — Ivoire / particule"></div></article></figure><figure><figcaption>Acier / particule</figcaption><article class="card acier"><h2>Cible</h2><div class="art"><img src="images/particule.svg" alt="Un point se dirige vers sa cible."></div><p>Accélère vers sa cible.</p><div class="adjustment"><label for="weight-1">Poids</label><input id="weight-1" type="range" min="0" max="10" value="4" aria-label="Poids — Acier / particule"></div></article></figure><figure><figcaption>Ivoire / viseur FPS</figcaption><article class="card ivoire"><h2>Cible</h2><div class="art"><img src="images/viseur.svg" alt="Croix de visée et arme vue à la première personne."></div><p>Accélère vers sa cible.</p><div class="adjustment"><label for="weight-2">Poids</label><input id="weight-2" type="range" min="0" max="10" value="4" aria-label="Poids — Ivoire / viseur FPS"></div></article></figure><figure><figcaption>Acier / viseur FPS</figcaption><article class="card acier"><h2>Cible</h2><div class="art"><img src="images/viseur.svg" alt="Croix de visée et arme vue à la première personne."></div><p>Accélère vers sa cible.</p><div class="adjustment"><label for="weight-3">Poids</label><input id="weight-3" type="range" min="0" max="10" value="4" aria-label="Poids — Acier / viseur FPS"></div></article></figure></section><footer><a href="cartes-allegees.png">Voir la planche</a><a href="sources.json">Sources</a></footer></main><script>document.querySelectorAll('input[type=range]').forEach(slider=>{function paint(){slider.style.setProperty('--fill',slider.value*10+'%')}slider.addEventListener('input',paint);paint();});</script></body></html>
