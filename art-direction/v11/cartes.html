function setFlip(i,open,focus=false){const card=cards[i];card.dataset.flipped=String(open);card.querySelector('.front').setAttribute('aria-hidden',String(open));card.querySelector('.front').inert=open;card.querySelector('.back').setAttribute('aria-hidden',String(!open));card.querySelector('.back').inert=!open;const allOpen=cards.every(c=>c.dataset.flipped==='true');document.getElementById('flip-all').setAttribute('aria-pressed',String(allOpen));document.getElementById('flip-all').textContent=allOpen?'Voir les rectos':'Voir les versos';if(focus)card.querySelector(open?'.back .flip-button':'.front .flip-button').focus();}
document.querySelectorAll('[data-flip]').forEach(b=>b.addEventListener('click',()=>{const i=+b.dataset.flip;setFlip(i,cards[i].dataset.flipped!=='true',true);}));
document.getElementById('flip-all').onclick=()=>{const open=!cards.every(c=>c.dataset.flipped==='true');cards.forEach((c,i)=>setFlip(i,open));document.getElementById('flip-all').setAttribute('aria-pressed',String(open));document.getElementById('flip-all').textContent=open?'Voir les rectos':'Voir les versos';};
document.querySelectorAll('input[type=range]').forEach(slider=>{slider.addEventListener('input',()=>{slider.closest('[data-card]').querySelectorAll('input[type=range]').forEach(s=>{s.value=slider.value;s.style.setProperty('--fill',Number(slider.value)*10+'%');});});slider.style.setProperty('--fill','40%');});
</script></body></html>
