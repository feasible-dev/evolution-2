<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nico — First appearance</title>
<style>body{max-width:880px;margin:28px auto;padding:0 24px;background:#0b0d13;color:#ede9de;font:17px/1.5 system-ui}h1{font-size:28px}p{color:#bcc2cc;max-width:700px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}button,select{font:inherit;padding:8px 12px}button{cursor:pointer}.portraits{display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap}.sprite{width:256px;height:384px;background-image:url(nico-intro-native.png);background-size:1024px 1536px;image-rendering:pixelated}.reference{width:256px;height:384px;image-rendering:pixelated}figure{margin:0}figcaption{color:#9fa7b6;margin-top:10px}.sheet{max-width:100%;image-rendering:pixelated}a{color:#e9ae68}input{width:260px}</style>
<h1>Nico Valdés — First appearance</h1><p>He notices the camera, adjusts his glasses, gives a small shy open-hand wave, then settles with a friendly smile toward the viewer.</p>
<div class="controls"><button id="play">Pause</button><button id="replay">Replay</button><button id="prev">Previous</button><button id="next">Next</button><select id="speed" aria-label="Playback speed"><option value="1">Normal speed</option><option value="0.5">Half speed</option></select><select id="size" aria-label="Display size"><option value="1">Game size · 128 × 192</option><option value="2" selected>2× review size</option></select></div>
<div class="portraits"><figure><div id="sprite" class="sprite" role="img" aria-label="Nico introduction animation"></div><figcaption>Entrance study</figcaption></figure><figure><img id="reference" class="reference" src="current-game-portrait.png" alt="Nico's existing in-game portrait"><figcaption>Current game portrait</figcaption></figure></div>
<div class="controls"><input id="step" type="range" min="0" max="15" value="0" aria-label="Animation frame"><span id="label"></span></div>
<p>Loops here for review. Not yet integrated into the game.</p><p><a href="nico-intro-preview.gif">Animated GIF</a> · <a href="prompt.txt">Imagegen prompt</a> · <a href="animation.json">Timing</a></p><details><summary>All poses</summary><img class="sheet" src="nico-intro-native.png" alt="Sixteen entrance poses"></details>
<script>const delays=[450,200,200,140,160,180,140,140,200,230,200,150,150,150,350,800],names=["Rest","Notices camera","Small smile","Hand rising","Touches glasses","Adjusts glasses","Releases glasses","Greeting begins","Open-hand greeting","Small wrist wave","Wrist returns","Hand lowering","Settles","Settles toward camera","Friendly camera glance","Camera-facing rest"];
const el=id=>document.getElementById(id);let frame=0,elapsed=0,scale=2,last=performance.now(),playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){el('sprite').style.backgroundPosition=`${-(frame%4)*128*scale}px ${-Math.floor(frame/4)*192*scale}px`;el('step').value=frame;el('label').textContent=names[frame];el('play').textContent=playing?'Pause':'Play'}
function select(n){frame=(n+16)%16;elapsed=0;playing=false;render()}
el('play').onclick=()=>{playing=!playing;render()};el('replay').onclick=()=>{frame=0;elapsed=0;playing=true;render()};el('prev').onclick=()=>select(frame-1);el('next').onclick=()=>select(frame+1);el('step').oninput=e=>select(+e.target.value);
el('size').onchange=e=>{scale=+e.target.value;for(const id of ['sprite','reference']){el(id).style.width=(128*scale)+'px';el(id).style.height=(192*scale)+'px'}el('sprite').style.backgroundSize=(512*scale)+'px '+(768*scale)+'px';render()};
function tick(now){if(playing){elapsed+=Math.min(100,now-last)*+el('speed').value;while(elapsed>=delays[frame]){elapsed-=delays[frame];frame=(frame+1)%16;render()}}last=now;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>
