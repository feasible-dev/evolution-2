<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evolution Wars — studio compact</title>
<style>
*{box-sizing:border-box}body{background:#08090b;color:#ddd;margin:0;font:15px system-ui}header{padding:10px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{font-size:18px;margin:0}button{font:inherit;cursor:pointer;border:1px solid #888;padding:7px 14px;border-radius:5px;background:#25282c;color:#fff}button[aria-pressed=true]{background:#e8e5db;color:#151617}label{cursor:pointer}#stage{position:relative;max-width:min(100vw,calc((100vh - 118px)*16/9));margin:auto;aspect-ratio:16/9;background:#000}#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}#arena{display:none;position:absolute;left:18.85%;top:27.78%;width:62.3%;height:65.5%;border:2px dashed #fcf9b4;pointer-events:none}#arena span{position:absolute;bottom:12px;left:12px;background:#111;color:#fcf9b4;padding:6px}footer{font-size:13px;padding:9px 18px;color:#aaa}a{color:#a8d7e9}#original{visibility:hidden}
</style>
<header><h1>Studio noir / même place pour le jeu</h1><button id="conceptButton" aria-pressed="true">Proposition</button><button id="originalButton" aria-pressed="false">Écran actuel</button><label><input id="bounds" type="checkbox"> Repère de la patinoire actuelle</label></header>
<div id="stage"><img src="compact-studio.png" alt="Maquette compacte : studio noir, panneau suspendu et trois petites cartes côte à côte"><img id="original" src="../v46/captures/21-type-bold.png" alt="Capture actuelle pour comparer l'espace occupé"><div id="arena"><span>Emprise de la patinoire actuelle</span></div></div>
<footer>Maquette de style générée avec imagegen, pas une modification du jeu. Graphes, commandes et proportions conservés comme contraintes. <a href="prompt.json">Prompt</a> · Référence de plateau : <a href="https://mentorn.tv/programmes/programme-list/robot-wars/">Robot Wars / Mentorn</a></footer>
<script>
const original=document.querySelector('#original'),conceptButton=document.querySelector('#conceptButton'),originalButton=document.querySelector('#originalButton');
function showOriginal(value){original.style.visibility=value?'visible':'hidden';conceptButton.setAttribute('aria-pressed',String(!value));originalButton.setAttribute('aria-pressed',String(value))}
conceptButton.onclick=()=>showOriginal(false);originalButton.onclick=()=>showOriginal(true);
document.querySelector('#bounds').onchange=e=>document.querySelector('#arena').style.display=e.target.checked?'block':'none';
</script></html>
